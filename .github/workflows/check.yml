name: Library contracts and distributions
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: library-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: Lint and unit coverage / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        node: ['22.18.0', '24']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run test:coverage
  library:
    name: Library / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    # Includes a second build/test pass from the extracted release archives.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    defaults:
      run:
        shell: nix develop .#node${{ matrix.node }} --command bash --noprofile --norc -eo pipefail {0}
    steps:
      # Pin executable CI dependencies; update hashes deliberately after review.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
      - run: npm ci --ignore-scripts --registry=https://registry.npmjs.org --prefix lib/neonethack
      - run: node lib/neonethack/scripts/generate.ts --check
      - run: make -C lib/neonethack test
      - name: Build TypeScript consumers before workshop checks
        run: npm run --prefix lib/neonethack build
      - run: npm test --prefix examples/workshop
      - name: Pi tool binding and browser discovery (no model calls)
        run: node --test examples/agent-harness/pi-extension.test.mjs examples/pi-webmcp/run.test.mjs
      - run: npm run --prefix lib/neonethack test:install
      - name: pkg-config Lua headers and multiarch static-library selection
        run: npm run --prefix lib/neonethack test:lua-layout -- "$LUA_HOME/include" "$LUA_HOME/lib/liblua.a"
      - name: Installed C library and engine, away from the source tree
        run: |
          cmake --install lib/neonethack/build/native --prefix "$RUNNER_TEMP/neonethack"
          cc -Wall -Wextra -Werror -I"$RUNNER_TEMP/neonethack/include" examples/c/main.c \
            -L"$RUNNER_TEMP/neonethack/lib" -lneonethack -pthread -o "$RUNNER_TEMP/c-client"
          cd "$RUNNER_TEMP"
          ./c-client "$RUNNER_TEMP/neonethack/libexec/neonethack/engine" \
            "$RUNNER_TEMP/neonethack/share/neonethack/data" "$RUNNER_TEMP/c-worlds" > c-result.json
      - name: Clang C ABI, static namespace and shared exports
        run: |
          CC=clang CXX=clang++ \
            npm run --prefix lib/neonethack test:install
      - run: make -C lib/neonethack wasm
      - run: npm test --prefix lib/neonethack
      - run: npm run --prefix lib/neonethack test:wasm
      - run: node --test examples/benchmark/test.mjs examples/benchmark/leaderboard.test.mjs examples/cli-mcp-bot/tests/advisor.test.mjs
      - name: Chronicle evidence selection and exact static replay (no model calls)
        run: node --test examples/chronicle/*.test.mjs
      - name: Sandboxed browser example and IndexedDB contracts
        run: |
          # GitHub's Ubuntu image includes Google's installed, sandbox-capable
          # Chrome. Never disable the browser sandbox to bypass host policy.
          command -v google-chrome
          CHROMIUM="$(command -v google-chrome)" npm run --prefix lib/neonethack test:browser
      - name: Web UI, Vercel services and seeded dungeon renderer
        run: |
          bun install --frozen-lockfile --cwd web/neohack.dev
          bun run --cwd web/neohack.dev build
          npm run --prefix lib/neonethack check:tools
          bun install --frozen-lockfile --cwd hosting/vercel
          npm run --prefix hosting/vercel check
          CHROMIUM="$(command -v google-chrome)" npm test --prefix hosting/vercel
          CHROMIUM="$(command -v google-chrome)" bun run --cwd web/neohack.dev test
      - name: Build checked source/native/npm previews with embedded source
        run: |
          CHROMIUM="$(command -v google-chrome)" npm run --prefix lib/neonethack package:preview -- "$RUNNER_TEMP/distribution"
          cd "$RUNNER_TEMP/distribution"
          sha256sum -c SHA256SUMS
      # Build and audit previews without uploading artifacts.
