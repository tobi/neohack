name: Library contracts and distributions
on: [push, pull_request]
permissions:
  contents: read
jobs:
  library:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: lib/neonethack/package-lock.json
      - uses: jdx/mise-action@v2
        with:
          install: false
      - name: Native prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config libncurses-dev uuid-dev
          mise install lua@5.4.9
          echo "LUA_HOME=$(mise where lua@5.4.9)" >> "$GITHUB_ENV"
      - run: npm ci --prefix lib/neonethack
      - run: node lib/neonethack/scripts/generate.ts --check
      - run: make -C lib/neonethack test
      - run: npm test --prefix lib/neonethack
      - run: npm run --prefix lib/neonethack test:install
      - name: pkg-config Lua headers and multiarch static-library selection
        run: npm run --prefix lib/neonethack test:lua-layout -- "$LUA_HOME/include" "$LUA_HOME/lib/liblua.a"
      - name: Installed C library and engine, away from the source tree
        run: |
          cmake --install lib/neonethack/build/native --prefix "$RUNNER_TEMP/neonethack"
          cc -Wall -Wextra -Werror -I"$RUNNER_TEMP/neonethack/include" examples/c/main.c \
            -L"$RUNNER_TEMP/neonethack/lib" -lneonethack -pthread -o "$RUNNER_TEMP/c-client"
          cd "$RUNNER_TEMP"
          ./c-client "$RUNNER_TEMP/neonethack/libexec/neonethack/engine" \
            "$RUNNER_TEMP/neonethack/share/neonethack/data" "$RUNNER_TEMP/c-worlds" > c-result.json
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.9
          actions-cache-folder: emsdk-cache
      - name: Clang C ABI, static namespace and shared exports
        run: |
          CC="$EMSDK/upstream/bin/clang" CXX="$EMSDK/upstream/bin/clang++" \
            npm run --prefix lib/neonethack test:install
      - run: make -C lib/neonethack wasm
      - run: npm run --prefix lib/neonethack test:wasm
      - name: Sandboxed browser example and IndexedDB contracts
        run: |
          # GitHub's Ubuntu image includes Google's installed, sandbox-capable
          # Chrome. Never disable the browser sandbox to bypass host policy.
          command -v google-chrome
          CHROMIUM="$(command -v google-chrome)" npm run --prefix lib/neonethack test:browser
      - name: Build checked source/native/npm previews with embedded source
        run: |
          CHROMIUM="$(command -v google-chrome)" npm run --prefix lib/neonethack package:preview -- "$RUNNER_TEMP/distribution"
          cd "$RUNNER_TEMP/distribution"
          sha256sum -c SHA256SUMS
      # No publishing/uploading until the owner approves licensing and the
      # final release/source audit. Preview generation is deliberately local.
