name: Deploy neohack.dev and play.neohack.dev
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: deploy-neohack
  cancel-in-progress: true
jobs:
  deploy:
    name: Vercel
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: nix develop --command bash --noprofile --norc -eo pipefail {0}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
      - name: Verify public replay production configuration
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          PUBLIC_REPLAY_ORIGIN: ${{ vars.PUBLIC_REPLAY_ORIGIN }}
        run: node hosting/vercel/scripts/replay-deploy-env.mjs
      - name: Verify chronicle model access (OIDC, no stored key)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: node hosting/vercel/scripts/chronicle-deploy-env.mjs
      - name: Reuse hosted WASM compiler artifacts
        id: wasm-cache
        run: node hosting/vercel/scripts/runtime-package.mjs restore https://neohack.dev/
      - run: npm ci --ignore-scripts --registry=https://registry.npmjs.org --prefix lib/neonethack
      - run: make -C lib/neonethack wasm
        if: steps.wasm-cache.outputs.hit != 'true'
      - run: npm run --prefix lib/neonethack build
      - name: Lint and unit coverage gate
        run: |
          bun install --frozen-lockfile
          bun run lint
          bun run test:coverage
      - name: Pixel client
        run: |
          bun install --frozen-lockfile --cwd web/neohack.dev
          bun run --cwd web/neohack.dev build
      - run: bun install --frozen-lockfile --cwd hosting/vercel
      - name: Stage direct public replay delivery
        run: |
          test -n "$PUBLIC_REPLAY_ORIGIN" || { echo "Configure PUBLIC_REPLAY_ORIGIN for the dedicated public Blob store before deploying."; exit 1; }
          node hosting/vercel/scripts/stage.mjs
      - run: node hosting/vercel/scripts/verify-stage.mjs
      - name: Deploy Vercel
        working-directory: hosting/vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          node scripts/check-project.mjs
          bunx vercel deploy --yes --prod --scope tobi-projects
      - name: Verify live website and dashboard
        run: node hosting/vercel/scripts/smoke.mjs https://neohack.dev
