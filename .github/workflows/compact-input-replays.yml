name: Compact public input replay archives
on:
  workflow_dispatch:
    inputs:
      apply:
        description: Publish compact playlists while retaining all old objects and links
        type: boolean
        default: false
      run_id:
        description: One public run ID (blank selects concluded archives)
        type: string
        default: ''
      limit:
        description: Maximum archives to process in this batch (1–1000)
        type: string
        default: '100'
permissions:
  contents: read
concurrency:
  group: compact-public-input-replays
  cancel-in-progress: false
jobs:
  compact:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile --ignore-scripts --cwd hosting/vercel
      - run: node hosting/vercel/scripts/stage-validator.mjs
      - name: Inventory or compact acknowledged public inputs
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          APPLY: ${{ inputs.apply }}
          RUN_ID: ${{ inputs.run_id }}
          LIMIT: ${{ inputs.limit }}
        run: |
          args=(--compact-inputs --limit "$LIMIT")
          if [ -n "$RUN_ID" ]; then args+=(--run "$RUN_ID"); fi
          if [ "$APPLY" = true ]; then args+=(--apply); fi
          node hosting/vercel/scripts/publish-production-replays.mjs "${args[@]}"
