name: Inspect Vercel request failures
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Read sanitized production entry diagnostics
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          npx --yes vercel@59.10.0 logs --project "$VERCEL_PROJECT_ID" --scope "$VERCEL_ORG_ID" --token "$VERCEL_TOKEN" --environment production --since 2h --expand --limit 500 --json > "$RUNNER_TEMP/requests.jsonl"
          node <<'JS'
          const fs=require('node:fs');
          let records=0,events=0;const counts=new Map();
          function route(raw){try{const u=new URL(raw,"https://local.invalid"),p=u.searchParams.has("__path")?"/api/"+u.searchParams.get("__path"):u.pathname;return p.replace(/\/api\/vaults\/[^/]+/,"/api/vaults/:vault").replace(/\/api\/runs\/[^/]+/,"/api/runs/:run").replace(/\/api\/account\/.*/,"/api/account/*").match(/^\/api\/(vaults\/:vault(\/adventures)?|runs(\/:run(\/replay)?)?|account(\/\*)?|health|stats|errors)$/)?.[0]??"other";}catch{return "other";}}
          function inspect(value){
            if(typeof value==='string') {try{inspect(JSON.parse(value))}catch{};return;}
            if(!value||typeof value!=='object')return;
            if(['game_entry_failed','client_diagnostic','request_failed'].includes(value.event)){
              const safe={event:value.event};
              if(typeof value.code==='string'&&/^[a-z_]{1,48}$/.test(value.code))safe.code=value.code;
              if(['boot','create','resume'].includes(value.kind))safe.kind=value.kind;
              if(typeof value.local==='boolean')safe.local=value.local;
              if(typeof value.buildId==='string'&&/^[a-f0-9]{64}$/.test(value.buildId))safe.buildId=value.buildId;
              console.log(JSON.stringify(safe));events++;return;
            }
            for(const child of Object.values(value))inspect(child);
          }
          for(const line of fs.readFileSync(process.env.RUNNER_TEMP+'/requests.jsonl','utf8').split('\n')){
            if(!line.trim())continue;
            try{const record=JSON.parse(line);records++;const key=route(record.requestPath)+" "+(Number(record.responseStatusCode)||0);counts.set(key,(counts.get(key)||0)+1);inspect(record);if(records===1)console.log(JSON.stringify({keys:Object.keys(record)}));}catch{}
          }
          console.log(JSON.stringify({records,events,requests:Object.fromEntries(counts)}));
          JS
