name: Inspect Vercel request failures
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Read sanitized production entry diagnostics
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          npx --yes vercel@59.10.0 logs --project "$VERCEL_PROJECT_ID" --scope "$VERCEL_ORG_ID" --token "$VERCEL_TOKEN" --environment production --since 2h --level warning --expand --limit 500 --json > "$RUNNER_TEMP/requests.jsonl"
          node <<'JS'
          const fs=require('node:fs');
          let records=0,events=0;
          function inspect(value){
            if(typeof value==='string') {try{inspect(JSON.parse(value))}catch{};return;}
            if(!value||typeof value!=='object')return;
            if(['game_entry_failed','client_diagnostic'].includes(value.event)){
              const safe={event:value.event};
              if(typeof value.code==='string'&&/^[a-z_]{1,48}$/.test(value.code))safe.code=value.code;
              if(['boot','create','resume'].includes(value.kind))safe.kind=value.kind;
              if(typeof value.local==='boolean')safe.local=value.local;
              if(typeof value.buildId==='string'&&/^[a-f0-9]{64}$/.test(value.buildId))safe.buildId=value.buildId;
              console.log(JSON.stringify(safe));events++;return;
            }
            for(const child of Object.values(value))inspect(child);
          }
          for(const line of fs.readFileSync(process.env.RUNNER_TEMP+'/requests.jsonl','utf8').split('\n')){
            if(!line.trim())continue;
            try{const record=JSON.parse(line);records++;inspect(record);}catch{}
          }
          console.log(JSON.stringify({records,events}));
          JS
